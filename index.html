<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Expense Tracker Pro</h1>
        <p>Track your income and expenses with dark mode</p>
      </div>
      <button id="themeToggle" class="theme-toggle">🌙</button>
    </header>

    <section class="summary">
      <div class="card balance-card">
        <h3>Balance</h3>
        <p id="balance">₹0.00</p>
      </div>

      <div class="card income-card">
        <h3>Income</h3>
        <p id="income">₹0.00</p>
      </div>

      <div class="card expense-card">
        <h3>Expense</h3>
        <p id="expense">₹0.00</p>
      </div>
    </section>

    <section class="main-grid">
      <div class="panel">
        <h2>Add / Edit Transaction</h2>
        <form id="transactionForm">
          <input type="hidden" id="editId" />

          <label for="text">Title</label>
          <input type="text" id="text" placeholder="e.g. Recharge, Salary" required />

          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="Enter amount" min="0" required />

          <label for="type">Type</label>
          <select id="type" required>
            <option value="">Select Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>

          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Salary">Salary</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>

          <label for="date">Date</label>
          <input type="date" id="date" required />

          <button type="submit" class="btn primary-btn">Save Transaction</button>
        </form>
      </div>

      <div class="panel">
        <h2>History</h2>

        <div class="filters">
          <input type="text" id="searchInput" placeholder="Search by title..." />

          <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Salary">Salary</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>

          <select id="filterType">
            <option value="All">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <ul id="transactionList"></ul>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
